name: Contrôles du code

on:
  push:
    branches-ignore: ["main"]
  pull_request:
  workflow_call:

jobs:
  controles:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier la syntaxe de script.js
        run: node --check frontend/script.js

      - name: Vérifier les fichiers de données (JSON valide)
        run: |
          node -e "JSON.parse(require('fs').readFileSync('frontend/data/sites-injection-biomethane.geojson','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('frontend/data/communes-centres.json','utf8'))"

      - name: Vérifier la construction de l'image Docker
        run: docker build -t webmap-biomethane .